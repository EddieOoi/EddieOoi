<svg xmlns="http://www.w3.org/2000/svg" width="540" height="532" viewBox="0 0 540 532">
  <style>
    .window { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1px; }
    .title { fill: #8b949e; font-family: monospace; font-size: 12px; font-weight: bold; }
    .ascii { fill: #58a6ff; font-family: "Courier New", Courier, monospace; font-size: 10px; white-space: pre; }
    
    /* REPETITIVE PULSE LOOP - ALWAYS ACTIVE */
    .line {
      animation: pulseGlow 4s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% {
        opacity: 0.85;
        fill: #58a6ff; /* Standard terminal blue */
      }
      50% {
        opacity: 1;
        fill: #39d353; /* Bright matrix green sweep */
      }
    }
  </style>

  <!-- Terminal Window Outer Frame -->
  <rect class="window" width="540" height="532" />
  
  <!-- macOS Window Controls -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />
  
  <!-- Header Title -->
  <text x="270" y="24" text-anchor="middle" class="title">eddie@github: ~ $ ./portrait.sh</text>

