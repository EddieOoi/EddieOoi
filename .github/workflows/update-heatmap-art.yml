name: Update GitHub Heatmap Art

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r github-heatmap-art/requirements.txt

      - name: Generate Heatmap & ASCII SVG
        run: |
          python github-heatmap-art/generate_heatmap.py
          python github-heatmap-art/generate_ascii.py

      - name: Commit & Push Updated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(art): auto-update heatmap matrix artwork [skip ci]"
          file_pattern: "github-heatmap-art/data/* github-heatmap-art/output/*"
