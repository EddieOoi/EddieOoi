name: Generate Pacman Contribution Graph

on:
  schedule:
    # Runs automatically every 24 hours at midnight
    - cron: "0 0 * * *"
  # Allows you to manually trigger the workflow from the Actions tab
  workflow_dispatch:
  # Runs automatically whenever you push changes to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generate the Pac-Man animation SVG
      - name: Generate Pacman Animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # Push the generated SVG file to your output branch
      - name: Push Pacman SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
