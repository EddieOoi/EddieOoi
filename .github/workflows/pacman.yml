name: Generate Arcade Contribution Graphs

on:
  schedule:
    # Runs automatically every 24 hours at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 1: Create dist folder with full write permissions
      - name: Setup output directory
        run: |
          mkdir -p dist
          chmod -R 777 dist

      # Step 2: Generate Snake SVGs
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 3: Ensure permissions remain open for Pacman
      - name: Fix permissions for next step
        run: sudo chmod -R 777 dist

      # Step 4: Generate Pac-Man, Bomberman, Breakout & Puzzle Bobble SVGs
      - name: Generate Arcade Animations
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,bomberman,breakout,puzzle-bobble'

      # Step 5: Push ALL generated SVGs together to output branch
      - name: Push all SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
