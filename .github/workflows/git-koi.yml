name: Generate Git Koi

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-koi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Git Koi
        uses: yalongwastaken/git-koi@v1
        with:
          token: ${{ secrets.GIT_KOI_TOKEN }}
          login: EddieOoi
          output-dir: assets

      - name: Commit and Push Koi GIF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update git koi animation [skip ci]"
          file_pattern: "assets/koi.gif"
