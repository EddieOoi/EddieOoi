name: Update Space Shooter Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-game:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # 1. Generate Space Shooter GIF
      - name: Generate Space Shooter GIF
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'dist/space-shooter.gif'
          strategy: 'random'

      # 2. Deploy to the output branch (Creates/updates it automatically)
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
