<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 42" width="100%" height="42">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');

      text {
        font-family: 'Fira Code', Consolas, 'Cascadia Code', 'Courier New', monospace;
      }

      /* --- CHROMATIC GLITCH / SHIFT ANIMATION --- */
      @keyframes glitchRed {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        20% { transform: translate(-1px, 0.5px); opacity: 0.6; }
        40% { transform: translate(0.5px, -0.5px); opacity: 0.2; }
        60% { transform: translate(-0.5px, 0); opacity: 0.5; }
        80% { transform: translate(1px, -0.5px); opacity: 0.4; }
      }

      @keyframes glitchCyan {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        25% { transform: translate(1px, -0.5px); opacity: 0.6; }
        45% { transform: translate(-0.5px, 0.5px); opacity: 0.3; }
        65% { transform: translate(0.5px, 0); opacity: 0.5; }
        85% { transform: translate(-1px, 0.5px); opacity: 0.4; }
      }

      /* --- TYPING REVEAL ANIMATION --- */
      @keyframes typeReveal {
        0% { width: 0px; }
        50%, 90% { width: 170px; }
        100% { width: 0px; }
      }

      /* --- MINESWEEPER ANIMATIONS --- */
      @keyframes moveCursor {
        0%, 100% { transform: translate(30px, 28px) scale(1); }
        20%      { transform: translate(15px, 20px) scale(1); }
        25%      { transform: translate(15px, 20px) scale(0.85); }
        30%      { transform: translate(15px, 20px) scale(1); }
        60%      { transform: translate(25px, 10px) scale(1); }
        65%      { transform: translate(25px, 10px) scale(0.85); }
        70%      { transform: translate(25px, 10px) scale(1); }
      }

      @keyframes revealTile {
        0%, 24%  { opacity: 0; transform: scale(0.8); }
        26%, 92% { opacity: 1; transform: scale(1); }
        98%, 100% { opacity: 0; transform: scale(0.8); }
      }

      @keyframes plantFlag {
        0%, 64%  { opacity: 0; transform: translateY(-2px); }
        66%, 92% { opacity: 1; transform: translateY(0px); }
        98%, 100% { opacity: 0; transform: translateY(-2px); }
      }

      .glitch-r { animation: glitchRed 3s infinite ease-in-out; fill: #ff0055; }
      .glitch-c { animation: glitchCyan 3s infinite ease-in-out; fill: #ff79c6; }
      
      .prompt { fill: #ff5555; font-weight: 900; font-size: 13px; }
      .title-main { fill: #ff5555; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .subtitle-static { fill: #8b949e; font-size: 10px; font-weight: 400; letter-spacing: 1.2px; }

      .type-clip-rect { animation: typeReveal 6s steps(15) infinite; }

      .anim-cursor { animation: moveCursor 4.5s infinite cubic-bezier(0.4, 0, 0.2, 1); }
      .anim-reveal { animation: revealTile 4.5s infinite; transform-origin: 15px 20px; }
      .anim-flag   { animation: plantFlag 4.5s infinite; }
    </style>

    <clipPath id="title-type-clip">
      <rect class="type-clip-rect" x="48" y="0" width="170" height="42" />
    </clipPath>
  </defs>

  <!-- Container Box Matching Bomberman -->
  <rect x="1" y="1" width="798" height="40" rx="6" fill="#0b0e14" stroke="#21262d" stroke-width="1"/>

  <text x="28" y="26" class="prompt">&gt;</text>

  <g clip-path="url(#title-type-clip)">
    <g transform="translate(48, 26)">
      <text x="0" y="0" class="title-main glitch-r">MINESWEEPER</text>
      <text x="0" y="0" class="title-main glitch-c">MINESWEEPER</text>
      <text x="0" y="0" class="title-main">MINESWEEPER</text>
    </g>
  </g>

  <text x="190" y="25" class="subtitle-static">// MINE SWEEP SIMULATION</text>

  <!-- Right Graphic Element -->
  <g transform="translate(710, 8)">
    <g fill="#21262d" stroke="#30363d" stroke-width="0.8">
      <rect x="0" y="0" width="10" height="10" rx="1" />
      <rect x="12" y="0" width="10" height="10" rx="1" />
      <rect x="24" y="0" width="10" height="10" rx="1" />
      <rect x="0" y="12" width="10" height="10" rx="1" fill="#161b22" />
      <rect x="12" y="12" width="10" height="10" rx="1" />
      <rect x="24" y="12" width="10" height="10" rx="1" />
    </g>

    <text x="2" y="20" font-size="8" font-weight="bold" fill="#58a6ff">1</text>

    <g class="anim-reveal">
      <rect x="12" y="12" width="10" height="10" rx="1" fill="#161b22" stroke="#21262d" />
      <text x="14" y="20" font-size="8" font-weight="bold" fill="#58a6ff">1</text>
    </g>

    <g class="anim-flag" transform="translate(24, 0)">
      <line x1="3" y1="2" x2="3" y2="8" stroke="#8b949e" stroke-width="1" stroke-linecap="round" />
      <polygon points="3,2 8,4 3,6" fill="#ff5555" />
    </g>

    <g class="anim-cursor">
      <path d="M0,0 L0,8 L2.5,6 L4,9.5 L5.5,9 L4,5.5 L7,5.5 Z" fill="#ffffff" stroke="#000000" stroke-width="0.6" />
    </g>
  </g>
</svg>
