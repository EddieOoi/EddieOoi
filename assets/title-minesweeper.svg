<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 68" width="100%" height="68">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');

      text {
        font-family: 'Fira Code', Consolas, 'Cascadia Code', 'Courier New', monospace;
      }

      /* --- CHROMATIC GLITCH / SHIFT ANIMATION --- */
      @keyframes glitchRed {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        20% { transform: translate(-1px, 0.5px); opacity: 0.6; }
        40% { transform: translate(0.5px, -0.5px); opacity: 0.2; }
        60% { transform: translate(-0.5px, 0); opacity: 0.5; }
        80% { transform: translate(1px, -0.5px); opacity: 0.4; }
      }

      @keyframes glitchCyan {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        25% { transform: translate(1px, -0.5px); opacity: 0.6; }
        45% { transform: translate(-0.5px, 0.5px); opacity: 0.3; }
        65% { transform: translate(0.5px, 0); opacity: 0.5; }
        85% { transform: translate(-1px, 0.5px); opacity: 0.4; }
      }

      /* --- TYPING REVEAL ANIMATION FOR TITLE ONLY --- */
      @keyframes typeReveal {
        0% { width: 0px; }
        50%, 90% { width: 180px; }
        100% { width: 0px; }
      }

      /* --- MINESWEEPER MINI GAME ANIMATIONS --- */
      
      /* 1. Cursor movement &amp; click press */
      @keyframes moveCursor {
        0%, 100% { transform: translate(40px, 45px) scale(1); }
        20%      { transform: translate(22px, 32px) scale(1); } /* Move to center tile */
        25%      { transform: translate(22px, 32px) scale(0.85); } /* Click press */
        30%      { transform: translate(22px, 32px) scale(1); }
        60%      { transform: translate(36px, 18px) scale(1); } /* Move to top right */
        65%      { transform: translate(36px, 18px) scale(0.85); } /* Flag press */
        70%      { transform: translate(36px, 18px) scale(1); }
      }

      /* 2. Reveal Tile Animation */
      @keyframes revealTile {
        0%, 24%  { opacity: 0; transform: scale(0.8); }
        26%, 92% { opacity: 1; transform: scale(1); }
        98%, 100% { opacity: 0; transform: scale(0.8); }
      }

      /* 3. Flag Placement Animation */
      @keyframes plantFlag {
        0%, 64%  { opacity: 0; transform: translateY(-3px); }
        66%, 92% { opacity: 1; transform: translateY(0px); }
        98%, 100% { opacity: 0; transform: translateY(-3px); }
      }

      /* Colors &amp; Classes */
      .glitch-r { animation: glitchRed 3s infinite ease-in-out; fill: #ff0055; }
      .glitch-c { animation: glitchCyan 3s infinite ease-in-out; fill: #ff79c6; }
      
      /* Red Color Scheme for Title &amp; Prompt */
      .prompt { fill: #ff5555; font-weight: 900; font-size: 14px; }
      .title-main { fill: #ff5555; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
      .subtitle-static { fill: #8b949e; font-size: 11px; font-weight: 400; letter-spacing: 1.2px; }

      .type-clip-rect { animation: typeReveal 6s steps(15) infinite; }

      .anim-cursor { animation: moveCursor 4.5s infinite cubic-bezier(0.4, 0, 0.2, 1); }
      .anim-reveal { animation: revealTile 4.5s infinite; transform-origin: 22px 32px; }
      .anim-flag   { animation: plantFlag 4.5s infinite; }
    </style>

    <!-- Typing Mask for Title Reveal -->
    <clipPath id="title-type-clip">
      <rect class="type-clip-rect" x="52" y="0" width="180" height="68" />
    </clipPath>
  </defs>

  <!-- ================= CONTAINER CARD ================= -->
  <rect x="2" y="2" width="846" height="64" rx="6" fill="#0b0e14" stroke="#21262d" stroke-width="1.2"/>

  <!-- ================= TERMINAL TEXT CONTENT ================= -->
  <!-- Prompt Symbol > -->
  <text x="32" y="40" class="prompt">&gt;</text>

  <!-- Clipped Title Group (Animated) -->
  <g clip-path="url(#title-type-clip)">
    <g transform="translate(52, 40)">
      <!-- Red Shift Layer -->
      <text x="0" y="0" class="title-main glitch-r">MINESWEEPER</text>
      <!-- Pink/Cyan Shift Layer -->
      <text x="0" y="0" class="title-main glitch-c">MINESWEEPER</text>
      <!-- Main Face -->
      <text x="0" y="0" class="title-main">MINESWEEPER</text>
    </g>
  </g>

  <!-- Static Grey Subtitle -->
  <text x="200" y="39" class="subtitle-static">// MINE SWEEP SIMULATION</text>

  <!-- ================= RIGHT SIDE: MINESWEEPER SPRITES ================= -->
  <g transform="translate(755, 12)">
    
    <!-- 3x3 Grid - Unrevealed Tiles (3D Bevel look) -->
    <g fill="#21262d" stroke="#30363d" stroke-width="1">
      <!-- Row 1 -->
      <rect x="0" y="0" width="13" height="13" rx="1.5" />
      <rect x="15" y="0" width="13" height="13" rx="1.5" />
      <rect x="30" y="0" width="13" height="13" rx="1.5" />
      <!-- Row 2 -->
      <rect x="0" y="15" width="13" height="13" rx="1.5" fill="#161b22" />
      <rect x="15" y="15" width="13" height="13" rx="1.5" />
      <rect x="30" y="15" width="13" height="13" rx="1.5" />
      <!-- Row 3 -->
      <rect x="0" y="30" width="13" height="13" rx="1.5" />
      <rect x="15" y="30" width="13" height="13" rx="1.5" fill="#161b22" />
      <rect x="30" y="30" width="13" height="13" rx="1.5" />
    </g>

    <!-- Pre-revealed Numbers -->
    <!-- Number 1 (Blue) at Row 2, Col 1 -->
    <text x="3" y="25" font-size="10" font-weight="bold" fill="#58a6ff">1</text>
    <!-- Number 2 (Green) at Row 3, Col 2 -->
    <text x="18" y="40" font-size="10" font-weight="bold" fill="#39d353">2</text>

    <!-- Newly Revealed Tile (Row 2, Col 2) -->
    <g class="anim-reveal">
      <rect x="15" y="15" width="13" height="13" rx="1.5" fill="#161b22" stroke="#21262d" />
      <text x="18" y="25" font-size="10" font-weight="bold" fill="#58a6ff">1</text>
    </g>

    <!-- Planted Flag (Row 1, Col 3) -->
    <g class="anim-flag" transform="translate(30, 0)">
      <line x1="4" y1="2" x2="4" y2="11" stroke="#8b949e" stroke-width="1.2" stroke-linecap="round" />
      <polygon points="4,2 11,4.5 4,7" fill="#ff5555" />
    </g>

    <!-- Animated Pointer / Cursor -->
    <g class="anim-cursor">
      <path d="M0,0 L0,10 L3,8 L5,12 L7,11 L5,7 L9,7 Z" fill="#ffffff" stroke="#000000" stroke-width="0.8" />
    </g>

  </g>
</svg>
