<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 45" width="100%" height="45">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;display=swap');
      
      .bg { fill: #0d1117; rx: 6px; }
      .border { fill: none; stroke: #30363d; stroke-width: 1; }
      .text { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 700; fill: #f1e05a; letter-spacing: 2px; }
      .subtext { font-family: 'Fira Code', monospace; font-size: 11px; fill: #8b949e; }

      @keyframes typewriter {
        0% { width: 0px; }
        35%, 85% { width: 180px; }
        95%, 100% { width: 0px; }
      }

      .typewriter-mask {
        animation: typewriter 6s steps(13, end) infinite;
      }

      @keyframes chase {
        0% { transform: translateX(0px); }
        100% { transform: translateX(710px); }
      }
      .squad { animation: chase 10s linear infinite; }
    </style>

    <clipPath id="pacman-clip">
      <rect x="20" y="0" width="0" height="45" class="typewriter-mask" />
    </clipPath>
  </defs>

  <rect width="100%" height="100%" class="bg"/>
  <rect width="100%" height="100%" class="border" rx="6"/>

  <g class="squad">
    <path d="M 22 10 A 6 6 0 1 0 22 20 L 16 15 Z" fill="#f1e05a"/>
    <path d="M 32 10 Q 36 6 40 10 L 40 20 L 38 18 L 36 20 L 34 18 L 32 20 Z" fill="#ff7b72"/>
  </g>

  <g clip-path="url(#pacman-clip)">
    <text x="20" y="27" class="text">&gt; PACMAN_MAZE</text>
  </g>

  <text x="210" y="27" class="subtext">// GHOST CHASE SIMULATION</text>
</svg>
