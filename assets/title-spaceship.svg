<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 45" width="100%" height="45">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;display=swap');
      
      .bg { fill: #0d1117; rx: 6px; }
      .border { fill: none; stroke: #30363d; stroke-width: 1; }
      .text { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 700; fill: #58a6ff; letter-spacing: 2px; }
      .subtext { font-family: 'Fira Code', monospace; font-size: 11px; fill: #8b949e; }

      @keyframes typewriter {
        0% { width: 0px; }
        40%, 85% { width: 210px; }
        95%, 100% { width: 0px; }
      }

      .typewriter-mask {
        animation: typewriter 6.5s steps(15, end) infinite;
      }

      @keyframes fly {
        0% { transform: translate(0px, 0px); }
        50% { transform: translate(360px, -2px); }
        100% { transform: translate(720px, 0px); }
      }
      .ship { animation: fly 14s ease-in-out infinite; }
    </style>

    <clipPath id="shooter-clip">
      <rect x="20" y="0" width="0" height="45" class="typewriter-mask" />
    </clipPath>
  </defs>

  <rect width="100%" height="100%" class="bg"/>
  <rect width="100%" height="100%" class="border" rx="6"/>

  <g class="ship">
    <path d="M25,8 L27,8 L27,11 L29,11 L29,14 L23,14 L23,11 L25,11 Z" fill="#58a6ff"/>
    <rect x="25" y="14" width="2" height="3" fill="#bc8cff"/>
  </g>

  <g clip-path="url(#shooter-clip)">
    <text x="20" y="27" class="text">&gt; SPACE_SHOOTER</text>
  </g>

  <text x="240" y="27" class="subtext">// GALAGA ARCADE DEFENSE</text>
</svg>
