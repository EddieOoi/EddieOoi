<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="380">
  <defs>
    <!-- THEXRA Inspired Dark Gradient Background -->
    <linearGradient id="bg-grad-exp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a154b" />
      <stop offset="40%" stop-color="#0f1738" />
      <stop offset="80%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#0052cc" />
    </linearGradient>

    <!-- Background Wave Gradient -->
    <linearGradient id="wave-grad-exp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#9D4EDD" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0052cc" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    .bg-exp { fill: url(#bg-grad-exp); rx: 12px; }
    .border-exp { fill: none; stroke: rgba(0, 210, 255, 0.3); stroke-width: 1.5; rx: 12px; }
    
    /* Window Controls */
    .dot-red-exp { fill: #ff5f56; }
    .dot-yellow-exp { fill: #ffbd2e; }
    .dot-green-exp { fill: #27c93f; }
    .window-title-exp { font-family: 'Fira Code', monospace; font-size: 11px; fill: rgba(255, 255, 255, 0.4); }

    /* Timeline Typography */
    .company-exp { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .role-exp { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 600; fill: #00d2ff; }
    .role-alt-exp { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 600; fill: #9D4EDD; }
    .date-exp { font-family: 'Fira Code', monospace; font-size: 11px; fill: rgba(255, 255, 255, 0.45); }
    .desc-exp { font-family: 'Fira Code', monospace; font-size: 12px; fill: #c9d1d9; }

    /* Timeline Nodes &amp; Lines */
    .node-active-exp { fill: #00d2ff; stroke: #ffffff; stroke-width: 1.5; }
    .node-past-exp { fill: rgba(10, 37, 64, 0.8); stroke: #9D4EDD; stroke-width: 1.5; }
    .timeline-line-exp { stroke: rgba(0, 210, 255, 0.25); stroke-width: 2; stroke-dasharray: 4 4; }

    /* Background Wave Animation */
    @keyframes waveMoveExp {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0px); }
    }
    .wave-exp { animation: waveMoveExp 8s ease-in-out infinite; }
  </style>

  <!-- Background Card -->
  <rect width="800" height="380" class="bg-exp" />
  
  <!-- Animated Background Waves -->
  <g class="wave-exp">
    <path d="M-50 310 Q 150 250, 350 300 T 750 270 T 1150 310 L 1150 400 L -50 400 Z" fill="url(#wave-grad-exp)" />
    <path d="M-50 290 Q 200 330, 450 280 T 850 320 L 850 400 L -50 400 Z" fill="rgba(0, 210, 255, 0.08)" />
  </g>

  <rect width="800" height="380" class="border-exp" />

  <!-- Window Controls Header -->
  <circle cx="25" cy="22" r="5" class="dot-red-exp" />
  <circle cx="40" cy="22" r="5" class="dot-yellow-exp" />
  <circle cx="55" cy="22" r="5" class="dot-green-exp" />
  <text x="75" y="26" class="window-title-exp">eddieooi ~ /stage-clear-experience</text>

  <!-- Timeline Vertical Connecting Line -->
  <line x1="45" y1="75" x2="45" y2="300" class="timeline-line-exp" />

  <!-- ITEM 1: THEXRA (Engineer) -->
  <g transform="translate(45, 75)">
    <circle cx="0" cy="0" r="6" class="node-active-exp" />
    <g transform="translate(25, 4)">
      <text class="company-exp">THEXRA SDN BHD <tspan class="role-exp">· Associate Solutions Engineer</tspan></text>
      <text x="680" y="0" class="date-exp" text-anchor="end">MAY 2026 - AUG 2026</text>
      <text x="0" y="22" class="desc-exp">Engineered XR/AI industrial safety apps; designed CelcomDigi Metaversity curriculum.</text>
    </g>
  </g>

  <!-- ITEM 2: THEXRA (Coordinator) -->
  <g transform="translate(45, 150)">
    <circle cx="0" cy="0" r="5" class="node-past-exp" />
    <g transform="translate(25, 4)">
      <text class="company-exp">THEXRA SDN BHD <tspan class="role-alt-exp">· XR Coordinator</tspan></text>
      <text x="680" y="0" class="date-exp" text-anchor="end">NOV 2025 - MAY 2026</text>
      <text x="0" y="22" class="desc-exp">Developed enterprise AR/VR applications, custom 3D assets, and spatial workflows.</text>
    </g>
  </g>

  <!-- ITEM 3: Jacvid Technology -->
  <g transform="translate(45, 225)">
    <circle cx="0" cy="0" r="5" class="node-past-exp" />
    <g transform="translate(25, 4)">
      <text class="company-exp">JACVID TECH SUPPLY <tspan class="role-exp">· Online Manager</tspan></text>
      <text x="680" y="0" class="date-exp" text-anchor="end">MAR 2023 - JUN 2023</text>
      <text x="0" y="22" class="desc-exp">Administered backend operations across jacmore.com, Shopee, and Lazada storefronts.</text>
    </g>
  </g>

  <!-- ITEM 4: ArrayHubs -->
  <g transform="translate(45, 300)">
    <circle cx="0" cy="0" r="5" class="node-past-exp" />
    <g transform="translate(25, 4)">
      <text class="company-exp">ARRAYHUBS <tspan class="role-alt-exp">· Software Developer Intern</tspan></text>
      <text x="680" y="0" class="date-exp" text-anchor="end">AUG 2022 - FEB 2023</text>
      <text x="0" y="22" class="desc-exp">Built full-stack web applications &amp; custom CMS solutions via CodeIgniter MVC &amp; JS.</text>
    </g>
  </g>

  <!-- Live Pulse Dot -->
  <circle cx="755" cy="25" r="4" fill="#00d2ff" />
  <circle cx="755" cy="25" r="8" fill="#00d2ff" opacity="0.4">
    <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
