<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 45" width="100%" height="45">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;display=swap');
      
      .bg { fill: #0d1117; rx: 6px; }
      .border { fill: none; stroke: #30363d; stroke-width: 1; }
      .text { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 700; fill: #ffa657; letter-spacing: 2px; }
      .subtext { font-family: 'Fira Code', monospace; font-size: 11px; fill: #8b949e; }

      @keyframes typewriter {
        0% { width: 0px; }
        40%, 85% { width: 230px; }
        95%, 100% { width: 0px; }
      }

      .typewriter-mask {
        animation: typewriter 7s steps(17, end) infinite;
      }

      @keyframes walk {
        0% { transform: translateX(0px); }
        100% { transform: translateX(720px); }
      }
      @keyframes spark {
        0%, 100% { fill: #ffa657; }
        50% { fill: #ff7b72; }
      }
      .bomber { animation: walk 12s linear infinite; }
      .spark { animation: spark 0.3s infinite; }
    </style>

    <clipPath id="bomber-clip">
      <rect x="20" y="0" width="0" height="45" class="typewriter-mask" />
    </clipPath>
  </defs>

  <rect width="100%" height="100%" class="bg"/>
  <rect width="100%" height="100%" class="border" rx="6"/>

  <g class="bomber">
    <circle cx="20" cy="14" r="5" fill="#f0f6fc"/>
    <rect x="19" y="7" width="2" height="3" fill="#8b949e"/>
    <circle cx="20" cy="5" r="1.5" class="spark"/>
  </g>

  <g clip-path="url(#bomber-clip)">
    <text x="20" y="27" class="text">&gt; BOMBERMAN_ARENA</text>
  </g>

  <text x="260" y="27" class="subtext">// GRID BLAST SIMULATION</text>
</svg>
