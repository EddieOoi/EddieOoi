<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 68" width="100%" height="68">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');

      text {
        font-family: 'Fira Code', Consolas, 'Cascadia Code', 'Courier New', monospace;
      }

      /* --- CHROMATIC GLITCH / SHIFT ANIMATION --- */
      @keyframes glitchRed {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        20% { transform: translate(-1px, 0.5px); opacity: 0.6; }
        40% { transform: translate(0.5px, -0.5px); opacity: 0.2; }
        60% { transform: translate(-0.5px, 0); opacity: 0.5; }
        80% { transform: translate(1px, -0.5px); opacity: 0.4; }
      }

      @keyframes glitchCyan {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        25% { transform: translate(1px, -0.5px); opacity: 0.6; }
        45% { transform: translate(-0.5px, 0.5px); opacity: 0.3; }
        65% { transform: translate(0.5px, 0); opacity: 0.5; }
        85% { transform: translate(-1px, 0.5px); opacity: 0.4; }
      }

      /* --- TYPING REVEAL ANIMATION FOR TITLE ONLY --- */
      @keyframes typeReveal {
        0% { width: 0px; }
        50%, 90% { width: 200px; }
        100% { width: 0px; }
      }

      /* --- PUZZLE BOBBLE MINI GAME ANIMATIONS --- */
      
      /* 1. Pointer Aim Rotation */
      @keyframes aimPointer {
        0%, 100% { transform: rotate(-25deg); }
        35% { transform: rotate(15deg); }
        70% { transform: rotate(0deg); }
      }

      /* 2. Bubble Launch Physics Trajectory */
      @keyframes launchBubble {
        0%, 25% { transform: translate(24px, 48px) scale(1); opacity: 1; }
        50%     { transform: translate(24px, 25px) scale(1); opacity: 1; } /* Hits top group */
        55%, 95% { transform: translate(24px, 25px) scale(0); opacity: 0; } /* Merges/pops */
        100%    { transform: translate(24px, 48px) scale(1); opacity: 1; }
      }

      /* 3. Target Bubble Pop Effect */
      @keyframes popYellowBubble {
        0%, 48% { opacity: 1; transform: scale(1); }
        52%, 92% { opacity: 0; transform: scale(1.4); }
        98%, 100% { opacity: 1; transform: scale(1); }
      }

      /* Colors &amp; Classes */
      .glitch-r { animation: glitchRed 3s infinite ease-in-out; fill: #ff5555; }
      .glitch-c { animation: glitchCyan 3s infinite ease-in-out; fill: #50fa7b; }
      
      .prompt { fill: #8be9fd; font-weight: 900; font-size: 14px; }
      .title-main { fill: #8be9fd; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
      .subtitle-static { fill: #8b949e; font-size: 11px; font-weight: 400; letter-spacing: 1.2px; }

      .type-clip-rect { animation: typeReveal 6s steps(18) infinite; }

      .anim-pointer { animation: aimPointer 4s infinite ease-in-out; transform-origin: 24px 50px; }
      .anim-shot-bubble { animation: launchBubble 4s infinite cubic-bezier(0.25, 1, 0.5, 1); }
      .pop-target { animation: popYellowBubble 4s infinite; transform-origin: 24px 25px; }
    </style>

    <!-- Typing Mask for Title Reveal -->
    <clipPath id="title-type-clip">
      <rect class="type-clip-rect" x="52" y="0" width="200" height="68" />
    </clipPath>
  </defs>

  <!-- ================= CONTAINER CARD ================= -->
  <rect x="2" y="2" width="846" height="64" rx="6" fill="#0b0e14" stroke="#21262d" stroke-width="1.2"/>

  <!-- ================= TERMINAL TEXT CONTENT ================= -->
  <!-- Prompt Symbol > -->
  <text x="32" y="40" class="prompt">&gt;</text>

  <!-- Clipped Title Group (Animated) -->
  <g clip-path="url(#title-type-clip)">
    <g transform="translate(52, 40)">
      <!-- Red Shift Layer -->
      <text x="0" y="0" class="title-main glitch-r">PUZZLE_BOBBLE</text>
      <!-- Green Shift Layer -->
      <text x="0" y="0" class="title-main glitch-c">PUZZLE_BOBBLE</text>
      <!-- Main Face -->
      <text x="0" y="0" class="title-main">PUZZLE_BOBBLE</text>
    </g>
  </g>

  <!-- Static Grey Subtitle -->
  <text x="220" y="39" class="subtitle-static">// BUBBLE SHOOTER SIMULATION</text>

  <!-- ================= RIGHT SIDE: PUZZLE BOBBLE SPRITES ================= -->
  <g transform="translate(750, 0)">
    
    <!-- Ceiling Grid Bubbles (Top Row) -->
    <!-- Green Bubbles -->
    <circle cx="8" cy="18" r="5" fill="#50fa7b" />
    <circle cx="8" cy="18" r="3" fill="#a8ffc1" opacity="0.5" />

    <!-- Yellow Target Bubble Cluster -->
    <g class="pop-target">
      <circle cx="18" cy="18" r="5" fill="#f1fa8c" />
      <circle cx="28" cy="18" r="5" fill="#f1fa8c" />
      <circle cx="23" cy="25" r="5" fill="#f1fa8c" />
    </g>

    <!-- Pink/Red Bubbles -->
    <circle cx="38" cy="18" r="5" fill="#ff79c6" />
    <circle cx="48" cy="18" r="5" fill="#ff79c6" />

    <!-- Launched Yellow Bubble -->
    <g class="anim-shot-bubble">
      <circle cx="0" cy="0" r="5" fill="#f1fa8c" />
      <circle cx="-1" cy="-1" r="2" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Cannon / Shooter Base -->
    <g class="anim-pointer">
      <!-- Cannon Arrow -->
      <polygon points="24,38 21,46 27,46" fill="#8be9fd" />
      <line x1="24" y1="38" x2="24" y2="52" stroke="#8be9fd" stroke-width="2" />
    </g>
    <!-- Cannon Ring Base -->
    <circle cx="24" cy="50" r="6" fill="none" stroke="#6272a4" stroke-width="1.5" />
  </g>
</svg>
