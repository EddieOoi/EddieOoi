<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 42" width="100%" height="42">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');

      text {
        font-family: 'Fira Code', Consolas, 'Cascadia Code', 'Courier New', monospace;
      }

      /* --- CHROMATIC GLITCH / SHIFT ANIMATION --- */
      @keyframes glitchRed {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        20% { transform: translate(-1px, 0.5px); opacity: 0.6; }
        40% { transform: translate(0.5px, -0.5px); opacity: 0.2; }
        60% { transform: translate(-0.5px, 0); opacity: 0.5; }
        80% { transform: translate(1px, -0.5px); opacity: 0.4; }
      }

      @keyframes glitchCyan {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        25% { transform: translate(1px, -0.5px); opacity: 0.6; }
        45% { transform: translate(-0.5px, 0.5px); opacity: 0.3; }
        65% { transform: translate(0.5px, 0); opacity: 0.5; }
        85% { transform: translate(-1px, 0.5px); opacity: 0.4; }
      }

      /* --- UNIQUE TYPING SEQUENCE 2 --- */
      @keyframes typeRevealPuzzle {
        0% { width: 0px; }
        45%, 80% { width: 190px; }
        100% { width: 0px; }
      }

      /* --- PUZZLE BOBBLE ANIMATIONS --- */
      @keyframes aimPointer {
        0%, 100% { transform: rotate(-20deg); }
        35% { transform: rotate(15deg); }
        70% { transform: rotate(0deg); }
      }

      @keyframes launchBubble {
        0%, 25% { transform: translate(18px, 30px) scale(1); opacity: 1; }
        50%     { transform: translate(18px, 14px) scale(1); opacity: 1; }
        55%, 95% { transform: translate(18px, 14px) scale(0); opacity: 0; }
        100%    { transform: translate(18px, 30px) scale(1); opacity: 1; }
      }

      @keyframes popYellowBubble {
        0%, 48% { opacity: 1; transform: scale(1); }
        52%, 92% { opacity: 0; transform: scale(1.3); }
        98%, 100% { opacity: 1; transform: scale(1); }
      }

      .glitch-r { animation: glitchRed 3s infinite ease-in-out; fill: #ff5555; }
      .glitch-c { animation: glitchCyan 3s infinite ease-in-out; fill: #50fa7b; }
      
      .prompt { fill: #8be9fd; font-weight: 900; font-size: 13px; }
      .title-main { fill: #8be9fd; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .subtitle-static { fill: #8b949e; font-size: 10px; font-weight: 400; letter-spacing: 1.2px; }

      /* Medium typing pace with -1.5s start offset */
      .type-clip-rect { animation: typeRevealPuzzle 6.2s steps(13) infinite -1.5s; }

      .anim-pointer { animation: aimPointer 4s infinite ease-in-out; transform-origin: 18px 32px; }
      .anim-shot-bubble { animation: launchBubble 4s infinite cubic-bezier(0.25, 1, 0.5, 1); }
      .pop-target { animation: popYellowBubble 4s infinite; transform-origin: 18px 12px; }
    </style>

    <clipPath id="title-type-clip">
      <rect class="type-clip-rect" x="48" y="0" width="190" height="42" />
    </clipPath>
  </defs>

  <rect x="1" y="1" width="798" height="40" rx="6" fill="#0b0e14" stroke="#21262d" stroke-width="1"/>

  <text x="28" y="26" class="prompt">&gt;</text>

  <g clip-path="url(#title-type-clip)">
    <g transform="translate(48, 26)">
      <text x="0" y="0" class="title-main glitch-r">PUZZLE_BOBBLE</text>
      <text x="0" y="0" class="title-main glitch-c">PUZZLE_BOBBLE</text>
      <text x="0" y="0" class="title-main">PUZZLE_BOBBLE</text>
    </g>
  </g>

  <text x="210" y="25" class="subtitle-static">// BUBBLE SHOOTER SIMULATION</text>

  <g transform="translate(710, 0)">
    <circle cx="6" cy="11" r="3.5" fill="#50fa7b" />

    <g class="pop-target">
      <circle cx="14" cy="11" r="3.5" fill="#f1fa8c" />
      <circle cx="22" cy="11" r="3.5" fill="#f1fa8c" />
    </g>

    <circle cx="30" cy="11" r="3.5" fill="#ff79c6" />

    <g class="anim-shot-bubble">
      <circle cx="0" cy="0" r="3.5" fill="#f1fa8c" />
    </g>

    <g class="anim-pointer">
      <line x1="18" y1="24" x2="18" y2="33" stroke="#8be9fd" stroke-width="1.5" />
    </g>
  </g>
</svg>
