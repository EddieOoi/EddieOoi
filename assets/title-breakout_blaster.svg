<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 42" width="100%" height="42">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');

      text {
        font-family: 'Fira Code', Consolas, 'Cascadia Code', 'Courier New', monospace;
      }

      /* --- CHROMATIC GLITCH / SHIFT ANIMATION --- */
      @keyframes glitchRed {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        20% { transform: translate(-1px, 0.5px); opacity: 0.6; }
        40% { transform: translate(0.5px, -0.5px); opacity: 0.2; }
        60% { transform: translate(-0.5px, 0); opacity: 0.5; }
        80% { transform: translate(1px, -0.5px); opacity: 0.4; }
      }

      @keyframes glitchCyan {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        25% { transform: translate(1px, -0.5px); opacity: 0.6; }
        45% { transform: translate(-0.5px, 0.5px); opacity: 0.3; }
        65% { transform: translate(0.5px, 0); opacity: 0.5; }
        85% { transform: translate(-1px, 0.5px); opacity: 0.4; }
      }

      /* --- UNIQUE TYPING SEQUENCE 1 --- */
      @keyframes typeRevealBreakout {
        0% { width: 0px; }
        35%, 85% { width: 220px; }
        100% { width: 0px; }
      }

      /* --- BOUNCE VECTOR PHYSICS --- */
      @keyframes smoothBall {
        0%   { transform: translate(5px, 26px); }
        22%  { transform: translate(20px, 14px); }
        35%  { transform: translate(32px, 8px); }
        58%  { transform: translate(26px, 26px); }
        80%  { transform: translate(38px, 14px); }
        92%  { transform: translate(18px, 22px); }
        100% { transform: translate(5px, 26px); }
      }

      @keyframes smoothPaddle {
        0%   { transform: translateX(0px); }
        25%  { transform: translateX(8px); }
        58%  { transform: translateX(16px); }
        80%  { transform: translateX(28px); }
        100% { transform: translateX(0px); }
      }

      @keyframes breakYellowBrick {
        0%, 21% { opacity: 1; transform: scale(1); }
        22%, 92% { opacity: 0; transform: scale(0.4); }
        98%, 100% { opacity: 1; transform: scale(1); }
      }

      @keyframes breakGreenBrick {
        0%, 79% { opacity: 1; transform: scale(1); }
        80%, 94% { opacity: 0; transform: scale(0.4); }
        98%, 100% { opacity: 1; transform: scale(1); }
      }

      .glitch-r { animation: glitchRed 3s infinite ease-in-out; fill: #ff0055; }
      .glitch-c { animation: glitchCyan 3s infinite ease-in-out; fill: #bd93f9; }
      
      .prompt { fill: #ff79c6; font-weight: 900; font-size: 13px; }
      .title-main { fill: #ff79c6; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .subtitle-static { fill: #8b949e; font-size: 10px; font-weight: 400; letter-spacing: 1.2px; }

      /* Fast typing pace: 4.8s loop duration */
      .type-clip-rect { animation: typeRevealBreakout 4.8s steps(16) infinite; }

      .anim-ball { animation: smoothBall 4.2s infinite linear; }
      .anim-paddle { animation: smoothPaddle 4.2s infinite ease-in-out; }
      .yellow-brick { animation: breakYellowBrick 4.2s infinite; transform-origin: 22px 12px; }
      .green-brick { animation: breakGreenBrick 4.2s infinite; transform-origin: 38px 12px; }
    </style>

    <clipPath id="title-type-clip">
      <rect class="type-clip-rect" x="48" y="0" width="220" height="42" />
    </clipPath>
  </defs>

  <rect x="1" y="1" width="798" height="40" rx="6" fill="#0b0e14" stroke="#21262d" stroke-width="1"/>

  <text x="28" y="26" class="prompt">&gt;</text>

  <g clip-path="url(#title-type-clip)">
    <g transform="translate(48, 26)">
      <text x="0" y="0" class="title-main glitch-r">BREAKOUT_BLASTER</text>
      <text x="0" y="0" class="title-main glitch-c">BREAKOUT_BLASTER</text>
      <text x="0" y="0" class="title-main">BREAKOUT_BLASTER</text>
    </g>
  </g>

  <text x="240" y="25" class="subtitle-static">// BRICK BREAK SIMULATION</text>

  <g transform="translate(700, 0)">
    <rect x="0" y="10" width="12" height="4" rx="1" fill="#ff5555" />
    <rect x="16" y="10" width="12" height="4" rx="1" fill="#f1fa8c" class="yellow-brick" />
    <rect x="32" y="10" width="12" height="4" rx="1" fill="#50fa7b" class="green-brick" />

    <circle cx="0" cy="0" r="2.5" fill="#ffffff" class="anim-ball" />

    <g class="anim-paddle">
      <rect x="0" y="29" width="18" height="4" rx="1.5" fill="#8be9fd" />
    </g>
  </g>
</svg>
