<svg xmlns="http://www.w3.org/2000/svg" width="500" height="50" viewBox="0 0 500 50">
  <style>
    @keyframes rainbow {
      0% { stop-color: #ff0000; }
      20% { stop-color: #ff00ff; }
      40% { stop-color: #0000ff; }
      60% { stop-color: #00ffff; }
      80% { stop-color: #00ff00; }
      100% { stop-color: #ff0000; }
    }
    .stop1 { animation: rainbow 6s infinite linear; }
    .stop2 { animation: rainbow 6s infinite linear; animation-delay: -3s; }
    
    .text {
      font-family: 'Fira Code', monospace;
      font-weight: 600;
      font-size: 20px;
      fill: url(#rainbow-grad);
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>
  <defs>
    <linearGradient id="rainbow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="stop1" />
      <stop offset="100%" class="stop2" />
    </linearGradient>
  </defs>
  <text x="50%" y="50%" class="text">Full-Stack &amp; XR Developer</text>
</svg>
